<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none" className="w-full h-full">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F8FC" />
      <stop offset="100%" stop-color="#DFEEF9" />
    </linearGradient>
    <linearGradient id="badgeGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2575FC" />
      <stop offset="100%" stop-color="#6A11CB" />
    </linearGradient>
    <linearGradient id="hydroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9FF" />
      <stop offset="100%" stop-color="#92FE9D" />
    </linearGradient>
    <filter id="softGlow8" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1E4D7E" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="280" rx="24" fill="url(#bgGrad8)" />

  <!-- High-volume absorption dynamic wave background -->
  <path d="M0 200 C80 180, 140 230, 220 205 C300 180, 360 215, 400 200 L400 280 L0 280 Z" fill="#D3E7F7" opacity="0.6" />

  <!-- Central "12X" Mega Absorption Power Emblem -->
  <g transform="translate(70, 65)" filter="url(#softGlow8)">
    <!-- Outer Shield / Hexagonal Power Matrix -->
    <rect width="130" height="130" rx="28" fill="#FFFFFF" stroke="#ADCDEB" stroke-width="2.5" />
    
    <!-- Inner Radiant Fill -->
    <circle cx="65" cy="65" r="50" fill="#EDF5FD" />

    <!-- Huge "12X" Typography -->
    <text x="65" y="74" fill="#1C5EAC" font-family="system-ui, sans-serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="-1">
      12X
    </text>
    <text x="65" y="96" fill="#3D7EBD" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="1">
      ABSORPTION
    </text>
  </g>

  <!-- Heavy Flow Wave & SAP Core Lock Visualization (Right Side) -->
  <g transform="translate(225, 75)" filter="url(#softGlow8)">
    <rect width="135" height="115" rx="20" fill="#FFFFFF" stroke="#ADCDEB" stroke-width="2" />

    <text x="67" y="28" fill="#154A82" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
      HEAVY FLOW LOCK
    </text>

    <!-- Bio-SAP Crystal Network Beads -->
    <g fill="#2575FC">
      <circle cx="35" cy="55" r="8" opacity="0.9" />
      <circle cx="70" cy="50" r="10" opacity="0.95" />
      <circle cx="105" cy="58" r="7.5" opacity="0.85" />
      <circle cx="45" cy="85" r="9" opacity="0.95" />
      <circle cx="85" cy="82" r="9.5" opacity="0.9" />
    </g>

    <!-- Crystal light flares -->
    <g fill="#FFFFFF" opacity="0.8">
      <circle cx="33" cy="53" r="2.5" />
      <circle cx="67" cy="47" r="3" />
      <circle cx="103" cy="56" r="2" />
      <circle cx="43" cy="82" r="2.8" />
      <circle cx="82" cy="79" r="3" />
    </g>

    <!-- Connection Bonds between SAPs -->
    <path d="M35 55 L70 50 M70 50 L105 58 M45 85 L85 82 M70 50 L85 82 M35 55 L45 85" stroke="#99C2EE" stroke-width="1.8" />
  </g>

  <!-- Top Badge: Bio-Based SAPs -->
  <g transform="translate(25, 25)" filter="url(#softGlow8)">
    <rect width="145" height="30" rx="15" fill="#FFFFFF" stroke="#BDD6EF" stroke-width="1.5" />
    <circle cx="16" cy="15" r="7" fill="#2575FC" />
    <path d="M13 15 L15 17 L19 13" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="78" y="19" fill="#12487C" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">
      BIO-BASED SAP CORE
    </text>
  </g>

  <!-- Bottom Caption -->
  <g transform="translate(85, 230)">
    <rect width="230" height="26" rx="13" fill="#FFFFFF" stroke="#CCE0F2" stroke-width="1" />
    <text x="115" y="17" fill="#1C5287" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">
      Guaranteed Dryness Under Heavy Flow
    </text>
  </g>
</svg>
