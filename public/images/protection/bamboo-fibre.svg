<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none" className="w-full h-full">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F8F4" />
      <stop offset="100%" stop-color="#E5EDE2" />
    </linearGradient>
    <linearGradient id="bambooGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B7552" />
      <stop offset="50%" stop-color="#7B9A70" />
      <stop offset="100%" stop-color="#506748" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8EAF82" />
      <stop offset="100%" stop-color="#4F6946" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88C0D0" />
      <stop offset="100%" stop-color="#4C91A8" />
    </linearGradient>
    <filter id="softGlow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4A6542" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="280" rx="24" fill="url(#bgGrad1)" />

  <!-- Botanical Decorative Background Pattern -->
  <g opacity="0.15" stroke="#6B7B61" stroke-width="1.5" fill="none">
    <circle cx="340" cy="60" r="45" />
    <circle cx="340" cy="60" r="70" />
    <path d="M40 220 C80 180, 120 220, 160 180" stroke-dasharray="4 4" />
  </g>

  <!-- Bamboo Stalk 1 (Left Back) -->
  <g filter="url(#softGlow1)">
    <rect x="90" y="35" width="22" height="210" rx="6" fill="url(#bambooGrad)" opacity="0.85" />
    <line x1="88" y1="85" x2="114" y2="85" stroke="#3D5037" stroke-width="3" stroke-linecap="round" />
    <line x1="88" y1="145" x2="114" y2="145" stroke="#3D5037" stroke-width="3" stroke-linecap="round" />
    <line x1="88" y1="200" x2="114" y2="200" stroke="#3D5037" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Bamboo Stalk 2 (Center Main) -->
  <g filter="url(#softGlow1)">
    <rect x="135" y="20" width="30" height="235" rx="8" fill="url(#bambooGrad)" />
    <!-- Node rings -->
    <rect x="132" y="75" width="36" height="5" rx="2.5" fill="#3D5037" />
    <rect x="132" y="140" width="36" height="5" rx="2.5" fill="#3D5037" />
    <rect x="132" y="205" width="36" height="5" rx="2.5" fill="#3D5037" />
    <!-- Light reflection -->
    <rect x="141" y="22" width="5" height="230" rx="2" fill="#FFFFFF" opacity="0.3" />
  </g>

  <!-- Bamboo Stalk 3 (Right) -->
  <g filter="url(#softGlow1)">
    <rect x="185" y="45" width="20" height="200" rx="5" fill="url(#bambooGrad)" opacity="0.9" />
    <line x1="183" y1="105" x2="207" y2="105" stroke="#3D5037" stroke-width="2.5" stroke-linecap="round" />
    <line x1="183" y1="165" x2="207" y2="165" stroke="#3D5037" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Natural Bamboo Leaves -->
  <path d="M140 76 C110 50, 70 55, 45 70 C75 80, 115 82, 140 76 Z" fill="url(#leafGrad)" />
  <path d="M165 76 C200 50, 245 52, 275 68 C240 78, 195 82, 165 76 Z" fill="url(#leafGrad)" />
  <path d="M165 142 C205 125, 255 130, 285 150 C245 158, 200 155, 165 142 Z" fill="url(#leafGrad)" />
  <path d="M135 142 C95 125, 55 132, 30 152 C65 158, 105 155, 135 142 Z" fill="url(#leafGrad)" />

  <!-- Organic Fibre Weave Mesh Card (Right Side Overlay) -->
  <g transform="translate(230, 130)" filter="url(#softGlow1)">
    <rect width="135" height="115" rx="16" fill="#FFFFFF" fill-opacity="0.92" stroke="#9CA894" stroke-width="1.5" />
    
    <!-- Microfibre Weave Illustration -->
    <g stroke="#7B9A70" stroke-width="1.8" stroke-linecap="round" opacity="0.75">
      <!-- Horizontal microfibres -->
      <path d="M15 28 Q 67 22, 120 28" />
      <path d="M15 42 Q 67 36, 120 42" />
      <path d="M15 56 Q 67 50, 120 56" />
      <path d="M15 70 Q 67 64, 120 70" />
      <!-- Vertical interlaced microfibres -->
      <path d="M35 16 Q 30 50, 35 84" />
      <path d="M55 16 Q 60 50, 55 84" />
      <path d="M75 16 Q 70 50, 75 84" />
      <path d="M95 16 Q 100 50, 95 84" />
    </g>

    <!-- Badge text -->
    <rect x="15" y="90" width="105" height="18" rx="9" fill="#E8F1E5" />
    <text x="67" y="103" fill="#4B6342" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">
      100% ORGANIC FIBRE
    </text>
  </g>

  <!-- Fast Moisture Absorbing Droplets -->
  <g transform="translate(195, 80)">
    <path d="M18 2 C18 2, 8 16, 8 23 A10 10 0 0 0 28 23 C28 16, 18 2, 18 2 Z" fill="url(#dropGrad)" />
    <circle cx="15" cy="18" r="2.5" fill="#FFFFFF" opacity="0.6" />
    <!-- Downward absorption ripples -->
    <path d="M10 32 Q18 36, 26 32" stroke="#4C91A8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M6 38 Q18 43, 30 38" stroke="#4C91A8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
  </g>

  <!-- 3x-4x Faster Badge -->
  <g transform="translate(25, 30)" filter="url(#softGlow1)">
    <rect width="90" height="28" rx="14" fill="#FFFFFF" stroke="#DCE3D6" stroke-width="1.5" />
    <text x="45" y="18" fill="#4B6342" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">
      ⚡ 3-4X FASTER
    </text>
  </g>
</svg>
