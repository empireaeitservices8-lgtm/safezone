<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none" className="w-full h-full">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F6" />
      <stop offset="100%" stop-color="#EFEAE0" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B7B61" />
      <stop offset="100%" stop-color="#4E5D46" />
    </linearGradient>
    <filter id="softGlow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#3C4835" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="280" rx="24" fill="url(#bgGrad5)" />

  <!-- Outer protective security concentric lines -->
  <g opacity="0.25" stroke="#9CA894" stroke-width="1.5" stroke-dasharray="6 6" fill="none">
    <ellipse cx="200" cy="140" rx="140" ry="105" />
    <ellipse cx="200" cy="140" rx="165" ry="120" />
  </g>

  <!-- Pad Outline with 4-Wing Design & 360 Leak Barrier -->
  <g transform="translate(100, 25)" filter="url(#softGlow5)">
    <!-- Four Wings Background -->
    <!-- Top-Mid Wings -->
    <path d="M40 70 C0 65, -10 100, 35 110 L40 110" fill="#E8EFE5" stroke="#9CA894" stroke-width="2" />
    <path d="M160 70 C200 65, 210 100, 165 110 L160 110" fill="#E8EFE5" stroke="#9CA894" stroke-width="2" />
    
    <!-- Lower-Mid Wings (4-Wing Double Security) -->
    <path d="M42 130 C10 135, 5 165, 40 170 L42 170" fill="#E8EFE5" stroke="#9CA894" stroke-width="2" />
    <path d="M158 130 C190 135, 195 165, 160 170 L158 170" fill="#E8EFE5" stroke="#9CA894" stroke-width="2" />

    <!-- Main Pad Body (Ergonomic Hourglass / Curved Silhouette) -->
    <path d="M100 15 
             C145 15, 165 45, 162 90 
             C160 115, 150 120, 150 140 
             C150 160, 162 175, 160 200 
             C155 225, 135 235, 100 235 
             C65 235, 45 225, 40 200 
             C38 175, 50 160, 50 140 
             C50 120, 40 115, 38 90 
             C35 45, 55 15, 100 15 Z" 
          fill="#FFFFFF" stroke="#9CA894" stroke-width="2.5" />

    <!-- Inner 3D Anti-Leak Barrier Channels -->
    <path d="M100 32 
             C132 32, 146 55, 144 90 
             C142 110, 134 125, 134 140 
             C134 155, 144 170, 142 190 
             C138 210, 125 218, 100 218 
             C75 218, 62 210, 58 190 
             C56 170, 66 155, 66 140 
             C66 125, 58 110, 56 90 
             C54 55, 68 32, 100 32 Z" 
          fill="#F5F9F3" stroke="#6B7B61" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Core SAP High-Density Lock Center Zone -->
    <rect x="78" y="70" width="44" height="100" rx="22" fill="#E0EDE0" stroke="#7B9271" stroke-width="1.5" />

    <text x="100" y="125" fill="#4E5D46" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">
      SAP LOCK
    </text>
  </g>

  <!-- Side Leak Protection Shield Badge (Top Left) -->
  <g transform="translate(25, 25)" filter="url(#softGlow5)">
    <rect width="125" height="30" rx="15" fill="#FFFFFF" stroke="#D3DEC8" stroke-width="1.5" />
    <path d="M18 10 L25 13 L25 20 C25 24, 18 26, 18 26 C18 26, 11 24, 11 20 L11 13 Z" fill="url(#shieldGrad)" />
    <path d="M15 18 L17 20 L21 16" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="73" y="19" fill="#3D4B36" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">
      ANTI-LEAK LOCK
    </text>
  </g>

  <!-- Wing Tag (Right) -->
  <g transform="translate(270, 125)" filter="url(#softGlow5)">
    <rect width="105" height="26" rx="13" fill="#FFFFFF" stroke="#D3DEC8" stroke-width="1" />
    <text x="52" y="17" fill="#4E5D46" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">
      4-WING STABILITY
    </text>
  </g>
</svg>
