<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none" className="w-full h-full">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FAF8" />
      <stop offset="100%" stop-color="#E2F2ED" />
    </linearGradient>
    <linearGradient id="airStreamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#56B49A" />
      <stop offset="100%" stop-color="#8CE0C8" />
    </linearGradient>
    <filter id="softGlow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#286956" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="280" rx="24" fill="url(#bgGrad4)" />

  <!-- Cooling breeze background currents -->
  <g stroke="#93D3C1" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.35">
    <path d="M40 70 C 80 50, 120 90, 170 70 C 220 50, 260 80, 310 60" />
    <path d="M70 100 C 110 80, 150 120, 200 100 C 250 80, 290 110, 340 90" />
  </g>

  <!-- Upward Cool Airflow Breeze Streams -->
  <g stroke="url(#airStreamGrad)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#softGlow4)">
    <!-- Stream 1 (Left) -->
    <path d="M120 180 C110 140, 140 100, 125 50" />
    <path d="M118 60 L125 50 L132 62" stroke-width="2.5" />

    <!-- Stream 2 (Center Primary) -->
    <path d="M200 180 C190 130, 215 90, 200 35" stroke-width="3.5" />
    <path d="M192 48 L200 35 L208 48" stroke-width="3" />

    <!-- Stream 3 (Right) -->
    <path d="M280 180 C290 140, 260 100, 275 50" />
    <path d="M268 62 L275 50 L282 60" stroke-width="2.5" />
  </g>

  <!-- Micro-Ventilated Breathable Sheet Core -->
  <g transform="translate(60, 175)" filter="url(#softGlow4)">
    <rect width="280" height="36" rx="18" fill="#FFFFFF" stroke="#9FD4C4" stroke-width="2" />
    
    <!-- Micro Porous Air Vents -->
    <g fill="#56B49A">
      <circle cx="35" cy="18" r="3" />
      <circle cx="65" cy="18" r="3" />
      <circle cx="95" cy="18" r="3" />
      <circle cx="125" cy="18" r="3" />
      <circle cx="155" cy="18" r="3" />
      <circle cx="185" cy="18" r="3" />
      <circle cx="215" cy="18" r="3" />
      <circle cx="245" cy="18" r="3" />
    </g>

    <text x="140" y="-10" fill="#286956" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
      MICRO-VENTILATED BREATHABLE BACK SHEET
    </text>
  </g>

  <!-- Fresh Air Particles -->
  <g fill="#61C4AA" opacity="0.75">
    <circle cx="155" cy="85" r="4" />
    <circle cx="170" cy="130" r="3" />
    <circle cx="230" cy="70" r="4.5" />
    <circle cx="245" cy="120" r="3" />
    <circle cx="105" cy="110" r="3.5" />
  </g>

  <!-- Airflow Tag -->
  <g transform="translate(25, 25)" filter="url(#softGlow4)">
    <rect width="135" height="30" rx="15" fill="#FFFFFF" stroke="#B8E3D7" stroke-width="1.5" />
    <text x="67" y="19" fill="#1C5C4B" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
      💨 360° AIR CIRCULATION
    </text>
  </g>

  <!-- Heat & Moisture Reduction Callout -->
  <g transform="translate(90, 235)">
    <rect width="220" height="26" rx="13" fill="#FFFFFF" stroke="#C5E6DC" stroke-width="1" />
    <text x="110" y="17" fill="#286956" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">
      Zero Heat Buildup • All-Day Cool Freshness
    </text>
  </g>
</svg>
